name: PyCreator Android APK və Release

on:
  push:
    branches: [main]
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Sistem asılılıqlarını quraşdır
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool libltdl-dev pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo6 cmake libffi-dev libssl-dev \
            automake autopoint gettext

      - name: Buildozer quraşdır
        run: pip install buildozer setuptools cython==0.29.34

      - name: Keşi bərpa et
        uses: actions/cache@v5
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-${{ hashFiles('buildozer.spec','.github/workflows/build-apk.yml') }}

      - name: Tag versiyasını Buildozer-ə ötür
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag vX.Y.Z formatında olmalıdır"
            exit 1
          fi
          sed -i "s/^version = .*/version = $version/" buildozer.spec

      - name: İstifadəçi ikonunu Buildozer-ə qoş
        run: |
          if [ -f Assets/app_icon.jpg ]; then
            sed -i '/^version = /a icon.filename = %(source.dir)s/Assets/app_icon.jpg' buildozer.spec
            echo "PyCreator ikon faylı Buildozer konfiqurasiyasına əlavə edildi."
          else
            echo "::notice::Assets/app_icon.jpg tapılmadı; standart tətbiq ikonu ilə davam edilir."
          fi

      - name: APK qur
        run: |
          set -o pipefail
          buildozer -v android debug 2>&1 | tee build.log

      - name: Xəta xülasəsi
        if: failure()
        run: |
          set +e +o pipefail
          sed -i 's/\x1b\[[0-9;]*[A-Za-z]//g' build.log
          n=$(grep -n "Command failed" build.log | tail -1 | cut -d: -f1)
          {
            echo "## Xəta xülasəsi"
            grep -n -i -E "error|failed|traceback|not found|fatal" build.log | tail -25
            if [ -n "$n" ]; then
              start=$(( n > 70 ? n - 70 : 1 ))
              sed -n "${start},${n}p" build.log
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Tam logu saxla
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: build-log
          path: build.log

      - name: APK Artifact yüklə
        if: success() && !startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v6
        with:
          name: PyCreator-apk
          path: bin/*.apk
          if-no-files-found: error

      - name: Release APK fayllarını hazırla
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          mkdir -p release
          shopt -s nullglob
          files=(bin/*.apk)
          if [ ${#files[@]} -eq 0 ]; then
            echo "APK tapılmadı"
            exit 1
          fi
          for f in "${files[@]}"; do
            name=$(basename "$f")
            if [[ "$name" == *arm64-v8a* ]]; then
              cp "$f" "release/PyCreator-${GITHUB_REF_NAME}-arm64-v8a.apk"
            elif [[ "$name" == *armeabi-v7a* ]]; then
              cp "$f" "release/PyCreator-${GITHUB_REF_NAME}-armeabi-v7a.apk"
            else
              cp "$f" "release/PyCreator-${GITHUB_REF_NAME}.apk"
            fi
          done
          sha256sum release/*.apk > release/SHA256SUMS.txt

      - name: GitHub Release yarat və APK əlavə et
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: PyCreator ${{ github.ref_name }}
          generate_release_notes: true
          files: release/*
