name: APK qur

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Sistem asılılıqlarını quraşdır
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool libltdl-dev  pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo6 cmake libffi-dev libssl-dev \
            automake autopoint gettext

      - name: Buildozer quraşdır
        run: pip install buildozer setuptools cython==0.29.34

      - name: Keşi bərpa et
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-${{ hashFiles('buildozer.spec','.github/workflows/build-apk.yml') }}
        

      - name: APK qur
        run: |
          set -o pipefail
          buildozer -v android debug 2>&1 | tee build.log

      - name: Xəta xülasəsi
        if: failure()
        run: |
          set +e +o pipefail
          sed -i 's/\x1b\[[0-9;]*[A-Za-z]//g' build.log
          n=$(grep -n "Command failed" build.log | tail -1 | cut -d: -f1)
          {
            echo "## Xəta xülasəsi"
            echo
            echo "### Xəta sözləri olan sətirlər"
            echo '```'
            grep -n -i -E "error|failed|traceback|no matching|not found|fatal" build.log \
              | grep -v -E "Error code|Command failed|ENVIRONMENT|raising an issue|error might|Error: Process" \
              | tail -25 | cut -c1-250
            echo '```'
            if [ -n "$n" ]; then
              start=$(( n > 70 ? n - 70 : 1 ))
              echo "### Command failed sətrindən əvvəlki 70 sətir"
              echo '```'
              sed -n "${start},${n}p" build.log | cut -c1-250
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Tam logu saxla (xəta olanda)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: APK-nı yüklə
        uses: actions/upload-artifact@v4
        with:
          name: PyCreator-apk
          path: bin/*.apk
          if-no-files-found: error
