name: APK qur

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Sistem asılılıqlarını quraşdır
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo6 cmake libffi-dev libssl-dev \
            automake autopoint gettext

      - name: Buildozer quraşdır
        run: pip install buildozer setuptools cython==0.29.34

      - name: Keşi bərpa et
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-${{ hashFiles('buildozer.spec') }}
          restore-keys: buildozer-

      - name: APK qur
        run: buildozer -v android debug

      - name: APK-nı yüklə
        uses: actions/upload-artifact@v4
        with:
          name: PyCreator-apk
          path: bin/*.apk
          if-no-files-found: error
